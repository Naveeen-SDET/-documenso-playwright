name: Nightly Regression

on:
  # Runs automatically every night at midnight UTC
  # cron format: minute hour day-of-month month day-of-week
  # '0 0 * * *' = at 00:00, every day
  schedule:
    - cron: '0 0 * * *'

  # Allows manual trigger from the GitHub Actions UI
  # Go to Actions tab → Nightly Regression → Run workflow
  workflow_dispatch:

# ── Shared setup steps ───────────────────────────────────────────────────────
# Common setup (Node, pnpm, Docker, wait-for-app) lives in one place:
#   .github/actions/documenso-setup/action.yml
# Each test job calls it with a single `uses:` line instead of copy-pasting
# 7 identical steps. Each job still spins up its own fresh Ubuntu machine and
# its own Docker stack — all 6 jobs run IN PARALLEL — total time = slowest job.
#
# Note: --reporter=list is intentionally OMITTED from all test commands.
# The playwright.config.ts reporter array (list + html + markdown-summary)
# is used in full, so test-results/summary.md is generated on every run.

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — API Tests
  # Tests: auth guards, schema validation, pagination, CRUD, boundary conditions
  # CI safe: yes — uses public endpoints, no pre-seeded accounts needed
  # ════════════════════════════════════════════════════════════════════════════
  api-tests:
    name: API Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ── Sharding ────────────────────────────────────────────────────────────────
    # GitHub Actions matrix creates N copies of this job running simultaneously.
    # Each copy gets a different value of matrix.shard (1 or 2).
    # Playwright's --shard flag splits the test files between them:
    #   shard 1/2 → first half of tests/api/
    #   shard 2/2 → second half of tests/api/
    # Total wall-clock time ≈ halved. Each shard uploads its own artifacts.
    strategy:
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      # ── Composite action — replaces 7 copy-pasted setup steps ───────────────
      # Defined in .github/actions/documenso-setup/action.yml.
      # The dot-relative path works because checkout always runs first.
      - name: Documenso test environment setup
        uses: ./.github/actions/documenso-setup

      - name: Run API tests (shard ${{ matrix.shard }}/2)
        run: pnpm exec playwright test tests/api/ --project=ci --shard=${{ matrix.shard }}/2
        env:
          BASE_URL: http://localhost:3000
          SENDER_EMAIL: sender@test.com
          SENDER_PASSWORD: Test1234!
          SIGNER_EMAIL: signer@test.com
          SIGNER_PASSWORD: Test1234!
          INBUCKET_URL: http://localhost:9000

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-summary-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api-shard-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-test-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Security Tests
  # Tests: auth guards, token validation, protected UI routes, tampered tokens
  # CI safe: yes — all tests use unauthenticated requests or empty storage state
  # ════════════════════════════════════════════════════════════════════════════
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Documenso test environment setup
        uses: ./.github/actions/documenso-setup

      - name: Run security, network, and chaos tests
        run: pnpm exec playwright test tests/security/ tests/network/ tests/chaos/ --project=ci
        env:
          BASE_URL: http://localhost:3000
          SENDER_EMAIL: sender@test.com
          SENDER_PASSWORD: Test1234!
          SIGNER_EMAIL: signer@test.com
          SIGNER_PASSWORD: Test1234!
          INBUCKET_URL: http://localhost:9000

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-summary
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-security
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: security-test-report
          path: playwright-report/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Accessibility Tests
  # Tests: WCAG 2.1 AA compliance, known violations baseline, new violation gate
  # CI safe: yes — axe-core runs against the public signin and dashboard pages
  # ════════════════════════════════════════════════════════════════════════════
  a11y-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Documenso test environment setup
        uses: ./.github/actions/documenso-setup

      - name: Run accessibility tests
        run: pnpm exec playwright test tests/accessibility/ --project=ci
        env:
          BASE_URL: http://localhost:3000
          SENDER_EMAIL: sender@test.com
          SENDER_PASSWORD: Test1234!
          SIGNER_EMAIL: signer@test.com
          SIGNER_PASSWORD: Test1234!
          INBUCKET_URL: http://localhost:9000

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-test-summary
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-a11y
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-test-report
          path: playwright-report/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Contract Tests (Zod schema validation — positive + negative)
  # Tests: schema shape, negative contract proofs, strict mode, live API contract
  # CI safe: yes — negative tests use constructed objects, no pre-seeded accounts
  # ════════════════════════════════════════════════════════════════════════════
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Documenso test environment setup
        uses: ./.github/actions/documenso-setup

      - name: Run contract tests
        run: pnpm exec playwright test tests/api/contracts.spec.ts tests/api/contracts-negative.spec.ts --project=ci
        env:
          BASE_URL: http://localhost:3000
          SENDER_EMAIL: sender@test.com
          SENDER_PASSWORD: Test1234!
          SIGNER_EMAIL: signer@test.com
          SIGNER_PASSWORD: Test1234!
          INBUCKET_URL: http://localhost:9000

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-summary
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-contracts
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: contract-test-report
          path: playwright-report/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5 — Cross-Browser Tests (Firefox)
  # Tests: signin page, auth redirects, JS errors, page structure
  # CI safe: yes — all unauthenticated, no pre-seeded accounts needed
  # ════════════════════════════════════════════════════════════════════════════
  cross-browser-tests:
    name: Cross-Browser Tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Documenso test environment setup
        uses: ./.github/actions/documenso-setup

      # The composite action installs Chromium only.
      # Cross-browser tests also need Firefox — install it as an extra step.
      - name: Install Firefox browser
        run: pnpm exec playwright install firefox --with-deps

      - name: Run cross-browser tests
        run: pnpm exec playwright test tests/smoke/cross-browser.spec.ts --project=firefox
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-test-summary
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-cross-browser
          path: allure-results/
          retention-days: 7

      - name: Upload HTML report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-test-report
          path: playwright-report/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 6 — Pact Provider Verification
  # Tests: verifies the real Documenso API honours the consumer-generated contract
  # CI safe: yes — skips gracefully if DOCUMENSO_API_KEY secret is not configured
  # Requires: DOCUMENSO_API_KEY set as a GitHub Actions secret
  # ════════════════════════════════════════════════════════════════════════════
  pact-provider:
    name: Pact Provider Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: []
    # DOCUMENSO_API_KEY is required for this job to run provider verification.
    # If the secret is not configured in this repository, the test skips gracefully
    # but Jest still exits with code 1 (no assertions). continue-on-error keeps the
    # overall workflow green while the finding is still recorded in the job logs.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Pact runs Jest (not Playwright) — no Chromium binary needed.
      # install-playwright: 'false' skips the browser install step in the action.
      - name: Documenso test environment setup
        uses: ./.github/actions/documenso-setup
        with:
          install-playwright: 'false'

      - name: Run Pact provider verification
        run: pnpm test:pact:provider
        env:
          BASE_URL: http://localhost:3000
          DOCUMENSO_API_KEY: ${{ secrets.DOCUMENSO_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload pact results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pact-provider-report
          path: pacts/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 7 — Allure Report (combined + trend history)
  #
  # Runs AFTER all test jobs complete (pass or fail).
  # Downloads every job's allure-results, merges them into one report,
  # and restores/saves history so the Trends tab shows run-over-run changes.
  #
  # Trend tracking works by:
  #   1. Restoring allure-history from the previous run (GitHub Actions cache)
  #   2. Copying it into allure-results/history/ before generating
  #   3. Generating the report (Allure reads history/ automatically)
  #   4. Saving the new history back to the cache for the next run
  #
  # The generated report is uploaded as an artifact — downloadable from the
  # Actions UI. Open index.html locally or deploy to GitHub Pages.
  # ════════════════════════════════════════════════════════════════════════════
  allure-report:
    name: Allure Report (combined + trends)
    runs-on: ubuntu-latest
    needs:
      - api-tests
      - security-tests
      - a11y-tests
      - contract-tests
      - cross-browser-tests
    if: always()

    steps:
      - uses: actions/checkout@v4

      # ── Download all Allure results from parallel jobs ────────────────────
      # api-tests is sharded — each shard uploads its own artifact.
      # Download both and merge into the same allure-results/ directory.
      - name: Download API Allure results (shard 1)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api-shard-1
          path: allure-results/
        continue-on-error: true

      - name: Download API Allure results (shard 2)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api-shard-2
          path: allure-results/
        continue-on-error: true

      - name: Download Security Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-security
          path: allure-results/
        continue-on-error: true

      - name: Download Accessibility Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-a11y
          path: allure-results/
        continue-on-error: true

      - name: Download Contract Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-contracts
          path: allure-results/
        continue-on-error: true

      - name: Download Cross-Browser Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-cross-browser
          path: allure-results/
        continue-on-error: true

      # ── Restore trend history from previous run ───────────────────────────
      # This is what makes the Trends tab work — without it every run starts
      # from scratch and you never see pass-rate-over-time graphs.
      - name: Restore Allure history (for trend tracking)
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}
          restore-keys: |
            allure-history-

      - name: Copy history into allure-results
        run: |
          if [ -d allure-history ]; then
            cp -r allure-history allure-results/history
            echo "✓ Restored $(ls allure-history | wc -l) history entries"
          else
            echo "No previous history found — this will be the first trend data point"
          fi

      # ── Copy categories definition into results ───────────────────────────
      - name: Copy categories.json
        run: |
          if [ -f allure-results/categories.json ]; then
            echo "categories.json already present"
          else
            echo "[]" > allure-results/categories.json
          fi

      # ── Install Allure CLI and generate report ────────────────────────────
      - name: Install Allure CLI
        run: |
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.29.0/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      # ── Save updated history for next run ────────────────────────────────
      - name: Save Allure history for next run
        run: |
          mkdir -p allure-history
          cp -r allure-report/history/. allure-history/
          echo "✓ Saved history for next run"

      - name: Update history cache
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}

      # ── Upload finished report ────────────────────────────────────────────
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
