      - name: Run contract tests
        run: pnpm exec playwright test tests/api/contracts.spec.ts tests/api/contracts-negative.spec.ts --project=ci
        env:
          BASE_URL: http://localhost:3000
          SENDER_EMAIL: sender@test.com
          SENDER_PASSWORD: Test1234!
          SIGNER_EMAIL: signer@test.com
