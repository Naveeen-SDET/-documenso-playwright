        with:
          name: security-test-report
          path: playwright-report/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Accessibility Tests
  # Tests: WCAG 2.1 AA compliance, known violations baseline, new violation gate
  # CI safe: yes — axe-core runs against the public signin and dashboard pages
