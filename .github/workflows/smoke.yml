name: Smoke

# ── When it runs ──────────────────────────────────────────────────────────────
# Every push and PR to main — this is the PR gate.
# Runs the full ci project (API, security, a11y, contract, cross-browser tests).
# Must pass before a PR can merge.
#
# Three-tier CI strategy:
#   1. schema-check.yml  — instant (< 60s), no Docker, every push
#   2. smoke.yml         — fast    (< 10min), Docker, every PR          ← this file
#   3. regression.yml    — full    (parallel jobs), Docker, nightly
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Clone Documenso app
        run: git clone https://github.com/documenso/documenso.git documenso-app --depth=1

      - name: Start Documenso
        run: docker compose -f documenso-app/docker/testing/compose.yml up -d

      - name: Wait for app to be ready
        run: |
          echo "Waiting for http://localhost:3000..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && echo "App is up!" && break
            echo "Attempt $i/30 — retrying in 5s..."
            sleep 5
          done

      - name: Run smoke tests
        # No --reporter flag — playwright.config.ts reporters run in full:
        # list (terminal) + html (report folder) + markdown-summary (test-results/summary.md)
        run: pnpm exec playwright test --project=ci
        env:
          BASE_URL: http://localhost:3000
          SENDER_EMAIL: sender@test.com
          SENDER_PASSWORD: Test1234!
          SIGNER_EMAIL: signer@test.com
          SIGNER_PASSWORD: Test1234!
          INBUCKET_URL: http://localhost:9000

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-summary
          path: test-results/summary.md
          retention-days: 7

      - name: Upload HTML report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7
